version: 2

models:
  - name: fct_asset_metrics_daily
    description: >
      Conformed daily asset panel at grain (symbol, metric_date): Coin Metrics network and
      valuation metrics joined to CoinGecko's panel, with derived cost-approach metrics.
      The spine is the union of both vendors' symbol-days, so an asset Coin Metrics does not
      serve (SOL) still has rows, with every Coin Metrics column NULL.
      Two columns are resolved across vendors and one deliberately is not. price_usd is
      coalesced (Coin Metrics, else CoinGecko) because it is the same quantity measured by
      two vendors to within a fraction of a percent. Market cap is resolved too, with
      market_cap_source recording the vendor. Volume is NEVER coalesced:
      volume_reported_spot_usd (Coin Metrics) and volume_total_usd (CoinGecko) are different
      constructions over different exchange sets, about 5x apart on BTC, so each has its own
      velocity and a method must name which one it used. panel_vintage_ts stamps the silver
      panel state the row was built from; effective_end_ts is intentionally not carried,
      since on a current-state row it is always the open sentinel.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, metric_date]
    columns:
      - name: symbol
        tests: [not_null]
      - name: metric_date
        tests: [not_null]
      - name: market_cap_usd
        description: >
          Resolved across vendors; market_cap_source says which. NULL where Coin Metrics
          publishes no market cap and the asset is not routed to CoinGecko (6,905 rows
          on 2026-10-12, mostly BNB, DOT and MKR). The not_null test is therefore a WARNING,
          not an error: a genuine market-cap outage shows up as a rising warn count,
          while the blocking tripwires are the range bound and the identity checks.
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: market_cap_source
        description: >
          Which vendor supplied market_cap_usd: 'coinmetrics', or 'coingecko' where the free
          Coin Metrics tier serves none (TRX). NULL exactly when market_cap_usd is NULL.
        tests:
          - accepted_values:
              arguments:
                values: ['coinmetrics', 'coingecko']
              config:
                where: "market_cap_source is not null"
      - name: price_usd
        description: >
          Coin Metrics' price, else CoinGecko's. Coalesced, unlike volume, because both
          vendors measure the same quantity to within a fraction of a percent.
      - name: volume_total_usd
        description: >
          CoinGecko's TOTAL volume. A different construction from volume_reported_spot_usd,
          never coalesced with it.
      - name: velocity_reported
        description: >
          volume_reported_spot_usd / market_cap_usd. NULL when either is NULL or the market
          cap is not positive.
      - name: velocity_total
        description: >
          volume_total_usd / market_cap_usd. NULL when either is NULL or the market cap is
          not positive.
      - name: panel_vintage_ts
        description: >
          The latest effective_start_ts among the contributing metric groups (network,
          valuation, volume) of the silver panel: the state this row was built from. A
          quarantined cell changes velocity and so every Family A and D estimate, so two
          estimates that differ are comparable only when their vintages are.
      - name: mvrv
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                where: "mvrv is not null"
      - name: thermocap_usd
        description: >
          WINDOWED thermocap, not true thermocap: the cumulative sum of daily miner
          revenue (issuance_usd + fees_native * price_usd) from the first row of the
          panel for the asset, not from genesis. For BTC the panel starts in 2015
          while the chain started in 2009, so this understates the real quantity.
          A day with any NULL input contributes 0, so the series is a lower bound
          from the first gap onward; see thermocap_has_gap.
      - name: volume_reported_spot_usd
        description: >
          Coin Metrics' REPORTED SPOT volume (metric volume_reported_spot_usd_1d), the
          equation-of-exchange T term. It is NOT CoinGecko's total_volume: the exchange
          coverage differs, so the two series are not interchangeable and any velocity
          or holding-time figure must state which one it used. NULL on about 6% of
          asset-days; values above 1e12 USD are vendor corruption and are blocked by the
          contract's range maximum before they reach this table.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: thermocap_has_gap
        description: >
          True from the first row where issuance_usd, fees_native or price_usd was
          NULL, and on every later row for that asset. When true thermocap_usd is a
          LOWER bound, so mvtv (market cap / thermocap) and investor_cap_usd
          (realized_cap - thermocap) are both biased UPWARD and must not be read as
          exact.
        tests: [not_null]

  - name: fct_protocol_revenue_daily
    description: >
      Protocol fees and revenue at the valuation grain (symbol, metric_date); only assets
      mapped to a DefiLlama slug appear. The spine is DefiLlama's per-protocol daily HISTORY
      and nothing else: the one-row-per-run snapshot contributes total_fees_30d where it
      covers the same (symbol, date) and contributes NO rows, because its rolling total24h
      stamped with the capture date duplicated the previous day's complete figure.
      revenue_regime separates a zero net revenue against non-zero fees (the fee switch is
      off: a finding) from an unknown one (a gap) and from a day with no activity at all.
      The current UTC date is absent by construction: a daily aggregate of a day that has
      not ended is partial, and the vendor's own total24h equals that partial value.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, metric_date]
    columns:
      - name: total_fees_usd
        description: >
          Gross fees for the day, USD, summed over the symbol's configured components. The
          sum covers only components that reported, so read it with composition_complete.
      - name: net_revenue_usd
        description: >
          Net protocol revenue for the day, USD; may be negative, and may exceed gross fees
          where the vendor's two series disagree (18 LINK rows do, by up to 76,669). Zero
          inside the fee span is a MEASUREMENT -- the protocol earned fees and distributed
          all of them -- and is labelled fees_fully_distributed. NULL only before the fee
          series began, where revenue_regime reports 'unknown'.
      - name: total_fees_30d
        description: >
          The snapshot's 30-day fee total, joined on (symbol, metric_date) where the
          snapshot covers it; NULL everywhere else, including every row the snapshot has
          not seen. The history endpoint serves a daily series, not a 30-day aggregate,
          and none is computed here. Measured 100% NULL while the snapshot's single row
          falls on the dropped partial day.
      - name: protocol_count
        description: >
          How many configured components reported that day. Its meaning CHANGES over time:
          a rise can be a genuine launch and a fall can be an adapter that has not
          published yet, so it is not a quality score on its own -- compare it with
          protocol_count_prior_day, or use composition_complete.
      - name: protocol_count_prior_day
        description: The same count on the preceding day, NULL on a symbol's first row.
      - name: composition_complete
        description: >
          False where fewer components reported than on the preceding day, which marks a
          composition artefact rather than a collapse in cash flow (MKR once read 6,708
          against 975,064 the day before). A trailing-window consumer must require it.
        tests: [not_null]
      - name: methodology_hash
        description: >
          Fingerprint of the component protocols' free-text methodology (spec 9.2), hashed
          from the fees payload. It is the CURRENT methodology applied to the whole history,
          so it cannot detect a definition change the vendor made mid-series, and it also
          changes when the component composition changes (SNX carries four distinct hashes).
      - name: series_source
        tests:
          - accepted_values:
              arguments:
                values: ['history']
      - name: revenue_regime
        tests:
          - accepted_values:
              arguments:
                values:
                  ['unknown', 'fees_fully_distributed', 'net_outflow', 'retains_revenue',
                   'no_activity']

  - name: fct_equity_prices_daily
    description: >
      Equity and macro closes at grain (symbol, metric_date). Separate from the crypto fact
      because the trading calendar differs: a shared spine would manufacture nulls on every
      weekend and holiday.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, metric_date]
    columns:
      - name: symbol
        tests: [not_null]
      - name: metric_date
        tests: [not_null]
      - name: price_usd
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]
      - name: halving_epoch
        tests: [not_null]

  - name: dim_asset
    description: >
      One row per symbol in config/assets.yml, seeded rather than derived from the panel,
      so an asset absent from every vendor feed (SOL on Coin Metrics) still exists here.
      The density columns are NULL for an asset with no observations, which is deliberate:
      no not_null test is placed on them.
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: total_supply
        description: >
          CoinGecko total supply (circulating plus locked, net of burns). NULL for the equities
          and for any asset CoinGecko has no row for. Point-in-time; see supply_as_of.
      - name: max_supply
        description: >
          CoinGecko hard cap. NULL means the asset has NO maximum supply (ETH, SOL, DOGE, TRX)
          or is not a CoinGecko asset: an FDV-based multiple does not exist for it. Never
          substitute total_supply -- that publishes a market-cap multiple under an FDV label.
      - name: supply_as_of
        description: >
          Date the current supply figures were first observed (the SCD2 version's
          effective_start_ts), NOT the date of the latest run. Methods that read the supply
          columns record it in inputs_used so a reader can see the figure is point-in-time.

  - name: stg_asset_metrics
    description: Coin Metrics panel resolved from vendor ids to symbol, one join per metric group.
    columns:
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: symbol

  - name: stg_market_chart
    description: CoinGecko panel resolved to symbol via the gecko_id on the assets seed.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_protocol_revenue
    description: DefiLlama protocols rolled up to symbol across the configured slug list.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_protocol_fee_history
    description: >
      DefiLlama per-protocol daily fee and revenue history rolled up to symbol across the
      configured slug list.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_supply_metadata
    description: >
      CoinGecko current supply metadata resolved to symbol. One row per symbol with a
      gecko_id and a current CoinGecko row.
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: vendor_fully_diluted_valuation
        description: >
          CoinGecko's own fully_diluted_valuation, kept under a name that says whose it is.
          It is NOT max_supply times price: measured against price x total_supply it matches
          for all 24 assets to within 0.5%. Do not mix it with an FDV computed from max_supply.

  - name: stg_equity_prices
    description: Equity and macro closes resolved to symbol via the yahoo_id on the assets seed.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_protocol_tvl
    description: >
      DefiLlama per-protocol daily TVL rolled up to symbol across the configured slug list.
      One row per (symbol, metric_date); the current UTC date is absent.
    columns:
      - name: symbol
        tests: [not_null]
      - name: tvl_usd
        description: >
          Sum of the symbol's configured components' TVL for the day, USD. NULL when no
          component reported, never 0.0 by aggregation.

  - name: fct_protocol_tvl_daily
    description: >
      Total value locked at the valuation grain (symbol, metric_date); only assets mapped
      to a DefiLlama slug appear. The denominator for P/TVL. The rollup adds a symbol's own
      protocols, which is addition of balances; it does NOT reconcile across symbols, where
      the same dollar is counted twice (ETH's chain TVL contains the Aave pools counted
      under AAVE), so a cross-asset sum of this column is not a market total. The current
      UTC date is absent: the vendor serves both today's 00:00 point and a live one.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, metric_date]
    columns:
      - name: tvl_usd
        description: >
          Balance at the end of the day, USD. Read it with composition_complete: a day that
          lost a component reads lower for a composition reason, not an economic one.
      - name: protocol_count
        description: How many configured components reported that day.
      - name: composition_complete
        description: >
          False marks a day that lost a component against the day before. A P/TVL built on
          such a day moves for a reason that is not about the protocol.
