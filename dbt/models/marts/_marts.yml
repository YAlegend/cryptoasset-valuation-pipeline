version: 2

models:
  - name: fct_asset_metrics_daily
    description: Conformed daily asset panel with derived cost-approach metrics.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, metric_date]
    columns:
      - name: symbol
        tests: [not_null]
      - name: metric_date
        tests: [not_null]
      - name: market_cap_usd
        description: >
          NULL where Coin Metrics publishes no market cap for the asset-day (6,623 rows
          on 2026-10-11, e.g. BNB and DOT). The not_null test is therefore a WARNING,
          not an error: a genuine market-cap outage shows up as a rising warn count,
          while the blocking tripwires are the range bound and the identity checks.
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: mvrv
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: thermocap_usd
        description: >
          WINDOWED thermocap, not true thermocap: the cumulative sum of daily miner
          revenue (issuance_usd + fees_native * price_usd) from the first row of the
          panel for the asset, not from genesis. For BTC the panel starts in 2015
          while the chain started in 2009, so this understates the real quantity.
          A day with any NULL input contributes 0, so the series is a lower bound
          from the first gap onward; see thermocap_has_gap.
      - name: volume_reported_spot_usd
        description: >
          Coin Metrics' REPORTED SPOT volume (metric volume_reported_spot_usd_1d), the
          equation-of-exchange T term. It is NOT CoinGecko's total_volume: the exchange
          coverage differs, so the two series are not interchangeable and any velocity
          or holding-time figure must state which one it used. NULL on about 6% of
          asset-days; values above 1e12 USD are vendor corruption and are blocked by the
          contract's range maximum before they reach this table.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: thermocap_has_gap
        description: >
          True from the first row where issuance_usd, fees_native or price_usd was
          NULL, and on every later row for that asset. When true thermocap_usd is a
          LOWER bound, so mvtv (market cap / thermocap) and investor_cap_usd
          (realized_cap - thermocap) are both biased UPWARD and must not be read as
          exact.
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]
      - name: halving_epoch
        tests: [not_null]

  - name: dim_asset
    description: >
      One row per symbol in config/assets.yml, seeded rather than derived from the panel,
      so an asset absent from every vendor feed (SOL on Coin Metrics) still exists here.
      The density columns are NULL for an asset with no observations, which is deliberate:
      no not_null test is placed on them.
    columns:
      - name: symbol
        tests: [not_null, unique]

  - name: stg_asset_metrics
    description: Coin Metrics panel resolved from vendor ids to symbol, one join per metric group.
    columns:
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: symbol

  - name: stg_market_chart
    description: CoinGecko panel resolved to symbol via the gecko_id on the assets seed.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_protocol_revenue
    description: DefiLlama protocols rolled up to symbol across the configured slug list.
    columns:
      - name: symbol
        tests: [not_null]

  - name: stg_equity_prices
    description: Equity and macro closes resolved to symbol via the yahoo_id on the assets seed.
    columns:
      - name: symbol
        tests: [not_null]
