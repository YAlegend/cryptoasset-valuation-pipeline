cryptoval:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "../data/cryptoval.duckdb"
      threads: 4
    # Plan 5 switches to this target without changing any model SQL.
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'not-set') }}"
      dataset: cryptoval
      location: US
      threads: 4
      priority: interactive
