method_id: price_to_sales
family: D_multiples
requires: [price_usd, supply, net_revenue_usd]
min_density: 0.5
min_rows: 365
params: {window_rows: 365, target_multiple: 15.0, denominator: net_revenue_usd}
citation: "P/S on NET protocol revenue, spec 10.4-10.5"

failure_modes:
- 'The retained share is what this measures, so a protocol in the fees_fully_distributed regime has a
  near-zero denominator and the multiple explodes: read revenue_regime on
  fct_protocol_revenue_daily before reading this number.'
- 'Net revenue can be NEGATIVE (a protocol paying out more than it earns is a real event). A negative
  trailing mean is refused rather than returned as a negative fair value.'
- 'target_multiple 15.0 is a CHOICE, not a measurement: the estimate scales linearly in it.'
- An annualised trailing window assumes the last year of revenue repeats.
assumptions:
- Trailing-window net revenue annualises, and 15x revenue is a defensible multiple.
