method_id: realized_price
family: E_cost
# Realized cap divided by supply: the average on-chain acquisition price of the circulating
# supply, and the dissertation's cost-approach anchor. Realized cap is DERIVED from market
# cap via the MVRV identity (spec 6.2), so this method is flagged circular by construction
# and is a cost basis rather than independent evidence of value.
requires:
  - realized_cap
  - supply
min_density: 0.5
min_rows: 30
params: {}
citation: "Coinmetrics (2018), realized capitalisation; dissertation section 3.5"
returns_fair_value: true

# Card prose (spec 12): the judgment that cannot be derived from the spec above.
failure_modes:
- Realized cap is derived from market cap via the MVRV identity (spec 6.2), so this is a cost basis,
  not independent evidence of value.
- If Coin Metrics redefines either side of that identity every number here is silently wrong, which
  is what the identity assertions guard.
- Lost and never-moved coins keep their original acquisition price in the average, so the level is biased
  low for the oldest chains.
assumptions:
- The last on-chain movement of a coin priced an economic transfer, not a wallet shuffle or an exchange's
  internal sweep.
- supply is the circulating supply (SplyCur), so a dormant or provably burned coin still divides the
  cap.
