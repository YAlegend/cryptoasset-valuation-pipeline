method_id: mvrv_reversion
family: E_cost
requires: [realized_cap, mvrv, supply]
min_density: 0.5
min_rows: 365
params: {min_history_rows: 180}
citation: "Murad Mahmudov & David Puell (2018), MVRV"

# Card prose (spec 12): the judgment that cannot be derived from the spec above.
failure_modes:
- 'Inherits the MVRV identity''s fragility (spec 6.2): realized_cap and mvrv are two views of one vendor
  computation.'
- Reversion assumes MVRV oscillates around a stable level; a regime change (ETF flows, a halving, the
  Merge) moves the level instead.
- The trailing median is computed on a history dominated by one cycle, so the target is often 'last
  cycle's price' restated.
assumptions:
- MVRV reverts to its own trailing central tendency within min_history_rows.
- Realized cap is measured consistently by the vendor across the whole window.
