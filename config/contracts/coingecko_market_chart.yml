contract:
  name: coingecko_market_chart
  version: "1.0.0"
  owner: yasir
  source_url: https://api.coingecko.com/api/v3

schema:
  required:
    - asset
    - metric_date
    - price_usd
  columns:
    asset: {type: string}
    metric_date: {type: date}
    price_usd: {type: float, minimum: 0}
    market_cap_usd: {type: float, minimum: 0}
    # See the Coin Metrics contract: an impossible volume blocks, an anomalous one warns.
    volume_usd: {type: float, minimum: 0, maximum: 1.0e+12}

quality:
  freshness:
    max_delay_hours: 48
  uniqueness:
    combination: [asset, metric_date]
  volume:
    anomaly_threshold: 0.5       # +/-50% vs trailing average (spec section 9.2)
