contract:
  name: defillama_fees
  version: "1.0.0"
  owner: yasir
  source_url: https://api.llama.fi

schema:
  # total_fees_24h is NOT required: 383 of 2,991 listed protocols report no 24h fees
  # (fix round 1, Ruling H). A NEGATIVE fee still fails the range bound below, by
  # design — that is a real data-quality signal, not a miscalibration (Ruling F).
  required:
    - protocol
  columns:
    protocol: {type: string}
    total_fees_24h: {type: float, minimum: 0}
    total_fees_30d: {type: float, minimum: 0}
    net_revenue_24h: {type: float, minimum: 0}
    methodology_hash: {type: string}

quality:
  uniqueness:
    combination: [protocol]
  volume:
    anomaly_threshold: 0.5
  notes: |
    methodology_hash fingerprints DefiLlama's own per-protocol methodology
    text. A change to it means the revenue series has been redefined and the
    history is no longer comparable (spec section 9.2).
    This is a text fingerprint, not a definition fingerprint: it covers only the
    free-text methodology field, so a change to DefiLlama's underlying computation,
    methodologyURL or revenue breakdown fields is not detected by it.
